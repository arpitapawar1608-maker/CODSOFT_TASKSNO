<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | CloudVault</title>

    <link rel="stylesheet" href="/style.css">
</head>


<body class="auth-page">

    <div class="auth-wrapper">

        <div class="auth-box">

            <!-- LOGO -->

            <a href="/" class="auth-logo">
                ☁ CloudVault
            </a>


            <!-- HEADING -->

            <div class="auth-heading">

                <div class="small-title">
                    SECURE CLOUD STORAGE
                </div>

                <h1>
                    Welcome Back 👋
                </h1>

                <p>
                    Login to access your cloud storage
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login →
                </button>

            </form>


            <!-- REGISTER -->

            <p class="auth-bottom">

                Don't have an account?

                <a href="/register">
                    Create an account
                </a>

            </p>


            <!-- HOME -->

            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- KEEP EXISTING LOGIN JS -->

    <script src="/login.js"></script>

</body>

</html>
