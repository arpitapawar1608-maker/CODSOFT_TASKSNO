<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account | CloudVault</title>

    <link rel="stylesheet" href="/style.css">
</head>


<body class="auth-page">

    <div class="auth-wrapper">

        <div class="auth-box">

            <!-- LOGO -->

            <a href="/" class="auth-logo">
                ☁ CloudVault
            </a>


            <!-- HEADING -->

            <div class="auth-heading">

                <div class="small-title">
                    JOIN CLOUDVAULT
                </div>

                <h1>
                    Create Account ✨
                </h1>

                <p>
                    Start storing your files securely
                </p>

            </div>


            <!-- REGISTER FORM -->

            <form id="registerForm">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >


                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required
                >


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account →
                </button>

            </form>


            <!-- LOGIN -->

            <p class="auth-bottom">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>


            <!-- HOME -->

            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- KEEP EXISTING JS -->

    <script src="/register.js"></script>

</body>

</html>
